<style>
:root{--bg:#07080C;--panel:rgba(255,255,255,.045);--panel-2:rgba(255,255,255,.07);--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.18);--ink:#F2F4F8;--muted:#98A1B3;--dim:#6B7385;--accent:#7C8CFF;--accent-2:#9B6BFF;--mask:#FF4D8D;--ok:#4ADE9A;--err:#FF6B83;color-scheme:dark}

background:radial-gradient(420px 220px at 50% 0,rgba(124,140,255,.12),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01));transition:border-color .2s,box-shadow .2s,background .2s}

.pop::before{content:"";position:absolute;top:-6px;left:calc(50% - var(--dx,0px) - 5px);width:10px;height:10px;transform:rotate(45deg);background:#14161D;border-left:1px solid var(--line-2);border-top:1px solid var(--line-2)}

.box{position:absolute;padding:0;margin:0;cursor:pointer;min-width:8px;min-height:8px;border-radius:4px;border:1.5px solid rgba(124,140,255,.95);background:rgba(124,140,255,.12);transition:background .15s,border-color .15s,box-shadow .15s}

.box.tmp{pointer-events:none;border-style:dashed;border-color:var(--mask);background:rgba(255,77,141,.12)}

#ov{position:absolute;inset:0;width:100%;height:100%;opacity:.6;pointer-events:none;border-radius:6px}
#wrap.pen #ov{pointer-events:auto;cursor:none;touch-action:none}
#pcur{position:absolute;z-index:3;pointer-events:none;border-radius:50%;border:1.5px solid rgba(255,255,255,.95);box-shadow:0 0 0 1px rgba(0,0,0,.55);transform:translate(-50%,-50%)}
#laser{position:absolute;inset:0;z-index:2;overflow:hidden;pointer-events:none;border-radius:6px}
#laser i{position:absolute;inset:0;
background:linear-gradient(90deg,transparent 0,#fff 50%,transparent 100%) bottom/100% 2px no-repeat,linear-gradient(180deg,transparent 55%,rgba(124,140,255,.22) 85%,rgba(155,107,255,.45) 100%);

@keyframes laser{from{transform:translateY(-100%)}to{transform:translateY(0)}}
progress{display:block;width:100%;height:4px;margin-top:12px;border:0;border-radius:99px;appearance:none;-webkit-appearance:none;background:var(--line);accent-color:var(--accent)}
progress::-webkit-progress-bar{background:var(--line);border-radius:99px}
progress::-webkit-progress-value{background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px}
progress::-moz-progress-bar{background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px}
#pcur.era{border-style:dashed}
#scanbar{display:flex;align-items:center;gap:14px;margin-top:12px}
#scanbar progress{flex:1;margin-top:0}
#scanbar .btn{height:34px;padding:0 14px;font-size:.84rem}
html.splashing,html.splashing body{overflow:hidden}
#splash{position:fixed;inset:0;height:100dvh;z-index:200;display:grid;place-items:center;background:radial-gradient(720px 440px at 50% 44%,rgba(124,140,255,.16),transparent 70%),#05060A;transition:opacity .75s ease,visibility .75s;will-change:opacity;contain:strict}

.sp-word{display:flex;align-items:baseline;font-weight:700;font-size:clamp(2.2rem,8.4vw,5.4rem);line-height:1;white-space:nowrap;letter-spacing:.07em;margin-right:-.07em;color:var(--ink);transform-origin:50% 50%;will-change:transform;backface-visibility:hidden;animation:sp-expand 2.3s cubic-bezier(.16,.8,.24,1) both}
.sp-word span{display:inline-block;will-change:transform,opacity;backface-visibility:hidden;animation:sp-letter .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*65ms + 120ms)}
.sp-word .gap{width:.34em}
.sp-word .w2{font-weight:400;color:#C9D0FF}
@keyframes sp-expand{from{transform:scale(.92) translateZ(0)}to{transform:scale(1) translateZ(0)}}
@keyframes sp-letter{from{opacity:0;transform:translate3d(0,.28em,0)}to{opacity:1;transform:translate3d(0,0,0)}}
.help-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:40;width:46px;height:46px;display:grid;place-items:center;padding:0;border-radius:50%;border:1px solid var(--line-2);background:rgba(20,22,29,.92);color:var(--muted);cursor:pointer;box-shadow:0 14px 34px -12px rgba(0,0,0,.85);transition:color .18s,border-color .18s,transform .18s}
.help-fab:hover{color:var(--ink);border-color:rgba(124,140,255,.6);transform:translateY(-1px)}
.help-fab .ic{width:22px;height:22px}
.modal{position:fixed;inset:0;z-index:150;display:grid;place-items:center;padding:20px;background:rgba(3,4,8,.68);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fadein .18s ease-out}
@keyframes fadein{from{opacity:0}}
.modal-card{scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain;width:min(580px,100%);max-height:min(82dvh,740px);overflow:auto;padding:20px 22px 12px;border-radius:22px;border:1px solid var(--line-2);background:#0F1118;box-shadow:0 50px 100px -30px rgba(0,0,0,.95)}
.modal-card::-webkit-scrollbar{display:none;width:0;height:0}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.modal-h h2{margin:0;font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
.x{width:36px;height:36px;display:grid;place-items:center;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;transition:color .18s,background .18s,border-color .18s}
.x:hover{color:var(--ink);background:rgba(255,255,255,.1);border-color:var(--line-2)}
.acc{list-style:none;margin:0;padding:0}
.acc-i{border-top:1px solid var(--line)}
.acc-i h3{margin:0;font:inherit}
.acc-b{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border:0;background:transparent;color:var(--ink);font:500 .95rem/1.35 Inter,system-ui,sans-serif;text-align:left;cursor:pointer}
.acc-b .n{min-width:1.6em;color:var(--accent);font-variant-numeric:tabular-nums;font-weight:600}
.acc-b .t{flex:1}
.acc-b .chev{color:var(--muted);transition:transform .25s ease,color .18s}
.acc-b:hover .chev{color:var(--ink)}
.acc-i.open .chev{transform:rotate(-90deg);color:var(--accent)}
.acc-p{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.acc-p>div{min-height:0;overflow:hidden}
.acc-i.open .acc-p{grid-template-rows:1fr}
.acc-p p{margin:0;padding:0 4px 16px calc(1.6em + 16px);color:var(--muted);font-size:.9rem;line-height:1.6}
#bar{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 4px 6px}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px}
.field{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:.85rem}

.field select option{background:#14161D;color:var(--ink)}
.field input[type=range]{width:110px;accent-color:var(--accent)}
.field input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.field output{min-width:2.2ch;color:var(--ink);font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font:500 .9rem Inter,system-ui,sans-serif;cursor:pointer;transition:background .18s,border-color .18s,color .18s,transform .18s,box-shadow .18s,filter .18s}
.btn:hover:not(:disabled){background:rgba(255,255,255,.11);border-color:var(--line-2);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn[aria-pressed="true"]{background:rgba(124,140,255,.2);border-color:var(--accent);color:#fff;box-shadow:0 0 0 3px rgba(124,140,255,.16)}
.btn.danger:hover:not(:disabled){border-color:var(--err);color:var(--err);background:rgba(255,107,131,.08)}
.btn.primary{height:48px;padding:0 28px;border:0;font-weight:600;font-size:.95rem;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 12px 30px -12px rgba(124,140,255,.85)}
.btn.primary:hover:not(:disabled){filter:brightness(1.1);background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 16px 36px -12px rgba(124,140,255,.95)}
.actions{margin-top:2px}
details{width:100%;text-align:center}
summary{display:inline-flex;align-items:center;gap:8px;list-style:none;cursor:pointer;color:var(--muted);font-size:.85rem;padding:8px 12px;border-radius:10px;transition:color .18s,background .18s}

summary:hover{color:var(--ink);background:var(--panel)}
.adv{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:12px;text-align:left}
.adv .field{justify-content:space-between}
.adv .pair{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.adv .pair{grid-template-columns:1fr}}
#msg{margin:2px 4px 12px;text-align:center;font-size:.92rem;color:var(--muted)}
#msg.err{color:var(--err)}
#msg:empty{display:none}

[hidden]{display:none!important}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,#drop:focus-visible,.box:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

<div id="splash" role="status" aria-label="AETIX DESIGN"><div class="sp-word" aria-hidden="true"></div></div>
<script>
(function(){
  var sp=document.getElementById('splash'),w=sp.firstElementChild,app=document.getElementById('app'),idx=0;
  window._ps=new Promise(function(r){window._pd=r}); 
  document.documentElement.classList.add('splashing');if(app)app.inert=true;
  'AETIX DESIGN'.split('').forEach(function(ch,n){
    var e=document.createElement('span');
    if(ch===' '){e.className='gap'}
    else{e.textContent=ch;e.style.setProperty('--i',idx++);if(n>5)e.className='w2'}
    w.appendChild(e);
  });
  setTimeout(function(){
    sp.classList.add('out');document.documentElement.classList.remove('splashing');if(app)app.inert=false;
    setTimeout(function(){sp.remove();window._pd()},900);
  },2300);
})();
</script>

<main class="page" id="app">
  <header>
    <div class="logo"><svg class="ic"><use href="#i-spark"/></svg></div>
    <h1>Removedor de marca d’água</h1>
    <p class="sub">Apague textos e marcas das suas imagens em poucos cliques.</p>
    <span class="pill" id="engine" data-s="load" role="status"><i></i><span id="engine-t">Carregando recursos…</span></span>
  </header>

  <section class="card">
    <p id="msg" role="status"></p>
    <label id="drop" tabindex="0">
      <span class="up-ic"><svg class="ic"><use href="#i-upload"/></svg></span>
      <strong>Arraste sua imagem aqui</strong>
      <span class="hint">ou cole com Ctrl+V</span>
      <span class="fake">Escolher arquivo</span>
      <span class="fmt">PNG · JPG · WebP</span>
      <input type="file" id="file" accept="image/*" hidden>
    </label>

    <div id="editor" hidden>
      <div class="topbar">
        <span id="count" role="status">0 textos</span>
        <div class="tools">
          <div class="tool">
            <button type="button" class="btn" id="pencil" aria-pressed="false" aria-expanded="false" title="Lápis: pinte à mão o que o OCR não detectou"><svg class="ic"><use href="#i-pencil"/></svg>Lápis</button>
            <div class="pop" id="penpop" hidden>
              <div class="pop-h"><span>Espessura do lápis</span><output id="penv">20px</output></div>
              <input type="range" id="pen" min="4" max="120" value="20" aria-label="Espessura do lápis">
            </div>
          </div>
          <div class="tool">
            <button type="button" class="btn" id="eraser" aria-pressed="false" aria-expanded="false" title="Borracha: apague partes do traço feito com o lápis"><svg class="ic"><use href="#i-rubber"/></svg>Borracha</button>
            <div class="pop" id="erapop" hidden>
              <div class="pop-h"><span>Largura da borracha</span><output id="erav">20px</output></div>
              <input type="range" id="era" min="4" max="120" value="20" aria-label="Largura da borracha">
            </div>
          </div>
          <button type="button" class="btn danger" id="reset"><svg class="ic"><use href="#i-trash"/></svg>Remover imagem</button>
        </div>
      </div>
      <div class="stage"><div id="wrap"><canvas id="cnv"></canvas><div id="boxes"></div><canvas id="ov"></canvas><div id="laser" hidden><i></i></div><div id="pcur" hidden></div></div></div>
      <div id="scanbar" hidden><progress id="prog" max="1" value="0"></progress><button type="button" class="btn ghost" id="cancel"><svg class="ic"><use href="#i-x"/></svg>Cancelar escaneamento</button></div>

      <div id="bar">
        <div class="row">
          <button type="button" class="btn ghost" id="all"><svg class="ic"><use href="#i-checks"/></svg>Selecionar todos</button>
          <button type="button" class="btn ghost" id="none"><svg class="ic"><use href="#i-x"/></svg>Limpar seleção</button>
          <button type="button" class="btn" id="draw" aria-pressed="false" title="Arraste sobre a imagem para marcar uma área que não foi detectada"><svg class="ic"><use href="#i-box"/></svg>Desenhar caixa</button>
          <button type="button" class="btn" id="rescan"><svg class="ic"><use href="#i-refresh"/></svg>Reescanear</button>
        </div>
        <div class="row actions">
          <button type="button" class="btn" id="undo" disabled><svg class="ic"><use href="#i-undo"/></svg>Desfazer</button>
          <button type="button" class="btn primary" id="go" disabled><svg class="ic"><use href="#i-eraser"/></svg>Remover selecionados</button>
          <button type="button" class="btn" id="save"><svg class="ic"><use href="#i-download"/></svg>Baixar PNG</button>
        </div>
        <details>
          <summary><svg class="ic"><use href="#i-sliders"/></svg>Ajustes</summary>
          <div class="adv">
            <label class="field">Idioma
              <select id="lang">
                <option value="por+eng">Português + Inglês</option>
                <option value="eng">Inglês</option>
                <option value="spa+eng">Espanhol + Inglês</option>
                <option value="fra+eng">Francês + Inglês</option>
                <option value="deu+eng">Alemão + Inglês</option>
                <option value="ita+eng">Italiano + Inglês</option>
              </select>
            </label>
            <label class="field">Detectar por
              <select id="gran"><option value="words">Palavras</option><option value="lines">Linhas</option></select>
            </label>
            <label class="field">Confiança mínima <input type="range" id="conf" min="0" max="95" value="45"><output id="confv">45</output></label>
            <label class="field">Modo
              <select id="mode"><option value="glyph">Só as letras</option><option value="box">Caixa inteira</option></select>
            </label>
            <label class="field">Algoritmo
              <select id="algo"><option value="telea">Suave</option><option value="ns">Bordas</option></select>
            </label>
            <label class="field">Margem da caixa <input type="range" id="pad" min="0" max="20" value="3"><output id="padv">3</output></label>
            <label class="field">Sensibilidade de cor <input type="range" id="thr" min="8" max="120" value="32"><output id="thrv">32</output></label>
            <label class="field">Espessura extra <input type="range" id="dil" min="0" max="8" value="3"><output id="dilv">3</output></label>
            <label class="field">Raio de reconstrução <input type="range" id="rad" min="1" max="15" value="5"><output id="radv">5</output></label>
            <label class="field">Leitura do texto
              <select id="psm"><option value="11" selected>Texto esparso (PSM 11)</option><option value="3">Página automática (PSM 3)</option><option value="6">Bloco único</option></select>
            </label>
            <label class="field">Agrupar caixas <input type="range" id="merge" min="0" max="4" step="0.1" value="1.5"><output id="mergev">1.5</output></label>
            <label class="field">Pré-processamento
              <select id="prep"><option value="otsu" selected>Otsu (rígido)</option><option value="adaptive">Adaptativo</option><option value="off">Desligado</option></select>
            </label>
            <label class="field">Rigor do filtro <input type="range" id="binc" min="3" max="24" value="10"><output id="bincv">10</output></label>
            <div class="pair">
              <label class="field"><span>Recriar granulado</span><input type="checkbox" id="tex" checked></label>
              <label class="field"><span>Remover metadados</span><input type="checkbox" id="meta" checked></label>
            </div>
          </div>
        </details>
      </div>
    </div>
  </section>

  <footer>
    Desenvolvido por <strong>AETIX DESIGN</strong><br>
    © AETIX DESIGN. Todos os direitos reservados.
  </footer>
</main>

<button type="button" class="help-fab" id="helpBtn" aria-label="Central de ajuda" aria-haspopup="dialog" title="Central de ajuda" hidden><svg class="ic"><use href="#i-help"/></svg></button>
<div class="modal" id="help" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="help-t">
    <div class="modal-h"><h2 id="help-t">Central de ajuda</h2><button type="button" class="x" id="helpX" aria-label="Fechar"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <ol class="acc" id="acc"></ol>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
