<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de Planos AETIX</title>
  <style>
    :root {
      --line-2: #4a4a4a;
      --ink: #ffffff;
      --muted: #a0a0a0;
      --dim: #666666;
      --soft: #8888ff;
      --accent: #9B6BFF;
      --accent-2: #bb8bff;
      --cta-ink: #ffffff;
      --err: #ff5252;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f1118; color: #fff; }
    .hdr { padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 8px; font: 800 1.1rem Inter,system-ui,sans-serif; letter-spacing: .04em; }
    .nav { display: flex; gap: 12px; }
    .nav-link { padding: 8px 16px; border-radius: 8px; color: var(--muted); text-decoration: none; }
    .nav-link.active { background: var(--accent); color: #0f1118; }
    .dd-user { display: flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; }
    .dd-avatar { width: 32px; height: 32px; }
    .plan-line { margin-left: 12px; }
    .plan-chip { display: inline-block; padding: 4px 8px; border-radius: 12px; font: 600 .7rem Inter,system-ui,sans-serif; letter-spacing: .1em; }
    .plan-chip.free { background: rgba(64,187,118,.2); color: #4fd3b2; }
    .plan-chip.starter { background: rgba(251,177,56,.2); color: #fbb138; }
    .plan-chip.pro { background: rgba(239,83,80,.2); color: #ef533c; }
    .plan-chip.mestre { background: rgba(139,197,238,.2); color: #8be5ee; border: 1px solid #8be5ee; }
    .dd-credits { margin-left: 12px; }
    .tokens-label { font: 600 .65rem Inter,system-ui,sans-serif; color: var(--muted); }
    .tokens-line { display: flex; align-items: center; gap: 8px; }
    .tokens-num { font: 800 .85rem Inter,system-ui,sans-serif; color: #ffd700; }
    .tokens-bar { width: 120px; height: 6px; background: rgba(255,255,255,.15); border-radius: 999px; overflow: hidden; margin-left: 4px; }
    .tokens-bar .filled { height: 100%; background: #4fd3b2; width: 50%; }
    /* Painel de planos */
    .ss { margin: 14px auto 0; width: min(1120px,calc(100vw - 22px)); border-radius: 22px; border: 1px solid var(--line-2); background:#0f1118; box-shadow:0 40px 80px -34px rgba(0,0,0,.4); }
    .ss-grip { position:relative;display:flex;justify-content:center;padding:2px 0 10px;cursor:grab;touch-action:none; }
    .ss-grip:active{cursor:grabbing}
    .ss-grip-bar{width:104px;height:6px;border-radius:999px;background:rgba(255,255,255,.32);box-shadow:0 1px 4px rgba(0,0,0,.4)}
    .ss-grip:hover .ss-grip-bar{background:rgba(255,255,255,.5)}
    .ss-close{position:absolute;right:0;top:0;width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:10px;background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer;font:600 1.1rem/1 Inter,system-ui,sans-serif}
    .ss-close:hover{color:#fff;background:rgba(255,255,255,.08);border-color:var(--line)}
    .ss-pay-close{position:absolute;right:0;top:0;width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:10px;background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer;font:600 1.1rem/1 Inter,system-ui,sans-serif;z-index:3}
    .ss-pay-close:hover{color:#fff;background:rgba(255,255,255,.08);border-color:var(--line)}
    .ss-pay-head{position:relative;display:flex;justify-content:center;padding:0 0 12px;cursor:grab;touch-action:none}
    .ss-pay-head:active{cursor:grabbing}
    .ss-pay-title{margin:0;font:800 .74rem/1 Inter,system-ui,sans-serif;letter-spacing:.22em;color:var(--soft);text-transform:uppercase}
    .ss-pay-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start}
    .ss-pay-left{display:grid;justify-items:center;gap:12px}
    .ss-pay-beneficios{display:grid;justify-items:center;gap:14px}
    .ss-beneficios-title{margin:0 0 10px;font:800 .72rem/1.2 Inter,system-ui,sans-serif;letter-spacing:.18em;color:var(--soft);text-transform:uppercase}
    .ss-beneficios-lista{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:.86rem;color:var(--muted)}
    .ss-beneficios-lista li{display:flex;gap:8px;align-items:flex-start;line-height:1.35}
    .ss-beneficios-lista li::before{content:"✓";color:#3DDC97;font-weight:800;flex:none}
    .ss-pay-acoes{display:grid;gap:8px;width:min(280px,100%)}
    @media (max-width:780px){.ss-pay-layout{grid-template-columns:1fr}.ss-pay-acoes{width:min(320px,100%)}}
    .ss-step{padding:16px}
    .ss-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .ss-card{position:relative;display:flex;flex-direction:column;gap:10px;padding:16px 14px 14px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid var(--line-2);color:var(--ink);text-align:left}
    .ss-card__nome{display:flex;align-items:center;gap:8px;font-size:.68rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
    .ss-card__marca{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line-2);flex:none}
    .ss-card__preco{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
    .ss-card__preco small{display:block;margin-top:3px;font-size:.66rem;font-weight:500;color:var(--dim)}
    .ss-card__cta{width:100%;height:40px;border:0;border-radius:12px;cursor:pointer;color:var(--cta-ink);font:800 .85rem Inter,system-ui,sans-serif;letter-spacing:.04em;background:linear-gradient(135deg,var(--cyan),var(--accent) 70%,var(--accent-2));box-shadow:0 0 0 1px rgba(var(--c-rgb),.5),0 0 18px 2px rgba(var(--c-rgb),.65),0 0 42px 6px rgba(var(--a-rgb),.45);transition:transform .15s,filter .15s,box-shadow .15s}
    .ss-card__cta:hover{transform:translateY(-2px);filter:brightness(1.1)}
    .ss-err{min-height:1.2em;margin:0 0 8px;color:var(--err);font-size:.82rem;text-align:center}
    .ss-title{margin:0 0 12px;font:800 .9rem Inter,system-ui,sans-serif;letter-spacing:.2em;color:var(--soft);text-transform:uppercase;text-align:center}
    .ss-cta{width:100%;height:48px;border:0;border-radius:16px;cursor:pointer;color:var(--cta-ink);font:800 1.1rem Inter,system-ui,sans-serif;letter-spacing:.04em;background:linear-gradient(135deg,var(--cyan),var(--accent) 70%,var(--accent-2));box-shadow:0 0 0 1px rgba(var(--c-rgb),.5),0 0 18px 2px rgba(var(--c-rgb),.65),0 0 42px 6px rgba(var(--a-rgb),.45);transition:transform .15s,filter .15s,box-shadow .15s}
    .ss-cta:hover{transform:translateY(-2px);filter:brightness(1.1)}
    [hidden] { display: none !important; }
    .pay-qr { width: 100px; height: 100px; background: #1a1a2a; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #666; font-size: .7rem; }
    .pay-code { width: 100%; padding: 8px; background: #111; border: 1px solid var(--line-2); border-radius: 6px; color: #fff; font-family: monospace; font-size: .7rem; resize: none; }
    .pay-btn { padding: 0 16px; height: 36px; font: 600 .75rem Inter,system-ui,sans-serif; }
    .pay-status { color: var(--dim); font-size: .75rem; margin-top: 4px; }
    .ss-note { color: var(--dim); font-size: .75rem; margin-top: 8px; }
    .plano-free .ss-card__cta { background: rgba(64,187,118,.3); color: #4fd3b2; pointer-events: none; opacity: .5; }
    .plano-starter .ss-card__cta { background: rgba(251,177,56,.3); color: #fbb138; pointer-events: none; opacity: .5; }
    .plano-pro .ss-card__cta { background: rgba(239,83,80,.3); color: #ef533c; pointer-events: none; opacity: .5; }
    .plano-mestre .ss-card__cta { background: transparent; color: #8be5ee; pointer-events: all; box-shadow: none; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="hdr">
    <button class="brand" aria-label="AETIX DESIGN AI">
      <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="none" stroke="#9B6BFF" stroke-width="1.5"/><path d="M32 12c8 0 12 6 12 12s-4 12-12 12S20 36 20 24 28 12 32 12z" fill="none" stroke="#9B6BFF" stroke-width="1.5"/></svg>
      <span>AE</span><span>TIX</span><span>AI</span>
    </button>
    <nav class="nav">
      <button class="nav-link active" data-tab="image"><span>Image</span></button>
      <button class="nav-link" data-tab="edit"><span>Edit</span></button>
    </nav>
    <a class="dd-user" id="profileMenu-t" href="#">
      <span class="dd-avatar" id="ddAvatar" aria-hidden="true"><svg><use href="#i-user"/></svg></span>
      <span id="profileName">Olá, visitante!</span>
      <span class="plan-line" aria-live="polite">
        <span class="plan-chip free" data-plan="free" hidden><b>Free</b></span>
        <span class="plan-chip starter" data-plan="starter" hidden><b>Starter</b></span>
        <span class="plan-chip pro" data-plan="pro" hidden><b>Pro</b></span>
        <span class="plan-chip mestre" data-plan="mestre" hidden><b>Mestre</b></span>
      </span>
    </a>
    <div class="dd-credits" data-credits data-variant="menu" hidden aria-label="Seus tokens">
      <span class="tokens-label" data-i18n="core.tokensLabel">Seus tokens</span>
      <span class="tokens-line">
        <b class="tokens-num" data-credit-count>500</b>
        <span class="tokens-bar"><span class="filled" style="width:50%"></span></span>
      </span>
    </div>
  </header>

  <!-- Painel de Planos -->
  <section class="ss" id="planosPanel" hidden aria-labelledby="planosTitle">
    <div class="ss-grip" id="planosHandle" role="button" tabindex="0" aria-label="Arraste para baixo para fechar" title="Arraste para baixo para fechar">
      <span class="ss-grip-bar"><span></span></span>
    </div>
    <h2 class="ss-title" id="planosTitle">PLANOS SEM RENOVAÇÃO</h2>

    <div class="ss-step" id="planosEscolher">
      <p class="ss-err" id="planosErro" role="alert"></p>
      <div class="ss-cards" id="planosCards" role="group" aria-label="Planos disponíveis"></div>
    </div>

    <div class="ss-step" id="planosPix" hidden>
      <div class="ss-pay-head">
        <span class="ss-grip-bar" aria-hidden="true"></span>
        <button type="button" class="ss-pay-close" id="planosPayClose" aria-label="Cancelar pagamento" title="Cancelar pagamento">&times;</button>
      </div>
      <h3 class="ss-pay-title" id="planosPayTitle">AETIX DESIGN AI</h3>
      <div class="ss-pay-layout">
        <div class="ss-pay-left">
          <div class="pay-qr" id="planQr">QR Code</div>
          <textarea class="pay-code" id="planCode" readonly spellcheck="false" aria-label="Pix copia e cola"></textarea>
          <div class="ss-pay-acoes">
            <button type="button" class="pay-btn" id="planCopy">Copiar código</button>
            <p class="pay-status" id="planStatus" role="status" hidden><i></i><span></span></p>
          </div>
          <p class="ss-note">Assim que o pagamento for confirmado, seus créditos e o seu plano entram na hora. A confirmação aparece sozinha aqui.</p>
        </div>
        <aside class="ss-pay-beneficios" aria-label="Benefícios do plano">
          <div>
            <h4 class="ss-beneficios-title" id="planosBenefitsTitle">BENEFÍCIOS</h4>
            <ul class="ss-beneficios-lista" id="planosBenefits"></ul>
          </div>
        </aside>
      </div>
    </div>
  </section>

  <script>
    // Inicialização simples para teste
    document.addEventListener('DOMContentLoaded', () => {
      // Criar cartões de plano
      const cardsDiv = document.getElementById('planosCards');
      if (!cardsDiv) return;
      
      const planos = [
        { id: 'free', nome: 'Free', creditos: 500, preco: 'Grátis', beneficios: ['500 créditos iniciais', 'Ferramentas básicas', 'Exportação PNG'], ativa: true },
        { id: 'starter', nome: 'Starter', creditos: 10000, preco: 'R$ 9,90', beneficios: ['10.000 créditos', 'Ferramentas avançadas', 'Prioridade'], ativa: false },
        { id: 'pro', nome: 'Pro', creditos: 35000, preco: 'R$ 24,90', beneficios: ['35.000 créditos', 'Todas as ferramentas', 'Suporte preferencial'], ativa: false },
        { id: 'mestre', nome: 'Mestre', creditos: -1, preco: 'Ilimitado', beneficios: ['Créditos ilimitados', 'Todas as funcionalidades', 'Status máximo'], ativa: false }
      ];
      
      cardsDiv.innerHTML = planos.map(p => `
        <div class="ss-card ${p.id}" data-id="${p.id}" ${p.ativa ? 'style="border:2px solid #4fd3b2;"' : ''}>
          <div class="ss-card__nome">${p.nome} <span class="ss-card__preco">${p.preco}/mês</span></div>
          <div class="ss-card__marca" style="background:${p.id==='mestre'?'#8be5ee':p.id==='pro'?'#ef533c':p.id==='starter'?'#fbb138':'#4fd3b2'}"></div>
          <button class="ss-card__cta" data-plan="${p.id}" ${!p.ativa ? '' : 'disabled'>Selecionar</button>
          <p style="font-size:.65rem;color:var(--dim);margin-top:4px">${p.beneficios.join(' • ')}</p>
        </div>
      `).join('');

      // Eventos dos botões
      cardsDiv.querySelectorAll('.ss-card__cta').forEach(btn => {
        btn.addEventListener('click', () => {
          const planId = btn.getAttribute('data-plan');
          alert('Plano ' + planId + ' selecionado (simulação)');
        });
      });

      // Abrir/fechar painel
      const panel = document.getElementById('planosPanel');
      const grip = document.getElementById('planosHandle');
      let aberto = false;
      
      function togglePainel() {
        if (aberto) {
          panel.hidden = true;
          panel.style.transform = '';
          grip.style.cursor = 'grab';
          aberto = false;
        } else {
          panel.hidden = false;
          grip.style.cursor = 'grabbing';
          aberto = true;
        }
      }
      
      grip.addEventListener('click', togglePainel);
      
      // X fechar
      const payClose = document.getElementById('planosPayClose');
      if (payClose) payClose.addEventListener('click', () => {
        panel.hidden = true;
        panel.style.transform = '';
        grip.style.cursor = 'grab';
        aberto = false;
        console.log('Pagamento cancelado, voltando ao painel de escolha');
      });

      // Arrastar para fechar
      let drag = null;
      if (grip) {
        grip.addEventListener('pointerdown', (e) => {
          drag = { startY: e.clientY, dy: 0 };
        });
        grip.addEventListener('pointermove', (e) => {
          if (!drag) return;
          drag.dy = Math.max(0, e.clientY - drag.startY);
          panel.style.transform = 'translateY(' + Math.min(drag.dy, 110) + 'px)';
        });
        grip.addEventListener('pointerup', () => {
          if (!drag) return;
          drag = null;
        });
        grip.addEventListener('pointercancel', () => {
          if (!drag) return;
          drag = null;
        });
      }
    });
  </script>

</body>
</html>
