<style>
/* PÁGINA DE MANUTENÇÃO · AETIX DESIGN AI · arquivo único, sem JavaScript e sem chamadas ao servidor */
:root{--bg:#09040F;--ink:#F6F0FA;--muted:#B5A6C4;--dim:#8A7A9B;--line:rgba(255,170,90,.2);--accent:#FF8A2B;--accent-2:#A855F7;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;min-height:100dvh;color:var(--ink);font:400 16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:radial-gradient(900px 520px at 85% -6%,rgba(168,85,247,.2),transparent 60%),radial-gradient(1100px 420px at 50% 112%,rgba(255,122,26,.3),transparent 62%),radial-gradient(700px 400px at 5% 30%,rgba(120,40,160,.18),transparent 60%),var(--bg)}
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.hw-hill{position:absolute;left:-10%;right:-10%;bottom:-18vh;height:36vh;border-radius:50%;background:radial-gradient(ellipse at 50% 0,rgba(60,18,80,.75),rgba(9,4,15,0) 70%)}
.hw-moon{position:absolute;top:clamp(48px,9vh,92px);right:clamp(-30px,6vw,9vw);width:clamp(76px,10vw,138px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 63% 29%,rgba(177,128,86,.55) 0 8%,transparent 9%),radial-gradient(circle at 30% 54%,rgba(177,128,86,.5) 0 11%,transparent 12%),radial-gradient(circle at 66% 62%,rgba(177,128,86,.5) 0 6.5%,transparent 7.5%),radial-gradient(circle at 36% 28%,#FFF2D2,#F6D79C 58%,#E8B777);
  box-shadow:0 0 50px 10px rgba(255,190,110,.3),0 0 120px 30px rgba(255,150,60,.12);opacity:.95;animation:moon 9s ease-in-out infinite alternate}
@keyframes moon{to{transform:translateY(8px)}}
.hw-stars{position:absolute;inset:0}
.hw-stars i{position:absolute;border-radius:50%;background:var(--c,#FF9B3D);box-shadow:0 0 8px 2px var(--c,#FF9B3D);opacity:0;animation:fly var(--d,6s) ease-in-out var(--w,0s) infinite}
@keyframes fly{0%,100%{opacity:0;transform:translate(0,0)}25%,70%{opacity:.8}50%{transform:translate(var(--x,10px),var(--y,-14px));opacity:.4}}
.hw-bat{position:absolute;top:0;left:0;width:34px;color:#1B1030;opacity:.95;filter:drop-shadow(0 0 7px rgba(168,85,247,.6))}
.b1{top:16%;animation:bat 19s linear infinite,flap .5s ease-in-out infinite alternate}
.b2{top:32%;width:26px;animation:bat 27s linear -9s infinite,flap .42s ease-in-out infinite alternate}
.b3{top:9%;width:20px;animation:bat 33s linear -20s infinite,flap .36s ease-in-out infinite alternate}
@keyframes bat{0%{left:-60px;margin-top:0}50%{margin-top:34px}100%{left:calc(100% + 60px);margin-top:-10px}}
@keyframes flap{to{transform:scaleY(.62)}}
.web{position:absolute;top:0;left:0;width:clamp(90px,12vw,150px);height:auto;color:rgba(255,160,80,.3)}
.pumpkin{position:absolute;left:clamp(10px,3vw,40px);bottom:max(12px,env(safe-area-inset-bottom,0px));width:clamp(52px,6vw,84px);height:auto;filter:drop-shadow(0 0 12px rgba(255,122,26,.65));animation:flick 3.2s ease-in-out infinite}
@keyframes flick{50%{filter:drop-shadow(0 0 20px rgba(255,170,60,.9))}}

main{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,3.4vh,30px);padding:max(28px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));text-align:center}
.brand{display:inline-flex;align-items:center;gap:.45em;font:700 clamp(1rem,4.6vw,1.7rem)/1 Inter,system-ui,sans-serif;letter-spacing:.14em;white-space:nowrap;padding:.55em 1em .55em .7em;border:1px solid var(--line);border-radius:18px;background:rgba(255,200,150,.04)}
.brand .logo{width:2.5em;height:2.5em;flex:none;margin-right:.3em;filter:drop-shadow(0 0 10px rgba(155,107,255,.55))}
.brand .b-1,.brand .b-3{background:linear-gradient(135deg,#FFD08A,#FF9B3D 55%,#C084FC);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .b-2{font-weight:400;color:#F0E0FF}
.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;border:1px solid rgba(255,170,90,.4);background:rgba(255,138,43,.1);color:#FFC98A;font-size:.74rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
h1{margin:0;font-size:clamp(2rem,6.4vw,3.6rem);font-weight:800;letter-spacing:-.03em;line-height:1.08;max-width:15ch}
h1 em{font-style:normal;background:linear-gradient(135deg,#FFD08A,#FF9B3D 55%,#C084FC);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:0;max-width:44ch;color:var(--muted);font-size:clamp(.98rem,2.6vw,1.12rem)}
.spooky{margin:0;color:#FFC98A;font-size:.95rem}
.en{margin:6px 0 0;color:var(--dim);font-size:.86rem}
.foot{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));z-index:1;text-align:center;color:var(--dim);font-size:.76rem}
@media (max-width:520px){.pumpkin{width:46px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.hw-stars i{opacity:.55}}
</style>
</head>
